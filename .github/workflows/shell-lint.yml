name: Shell Lint

on:
  pull_request: { paths: "**.sh" }
  push: { paths: "**.sh" }
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shell-lint:
    runs-on: ubuntu-latest

    env:
      SHFMT_VERSION: "3.13.1"

    steps:
      - uses: actions/checkout@v6

      - id: cache-shfmt
        name: Cache shfmt
        uses: actions/cache@v5
        with:
          key: ${{ runner.os }}-shfmt-${{ env.SHFMT_VERSION }}
          path: ~/.local/bin/shfmt

      - name: Download shfmt
        if: steps.cache-shfmt.outputs.cache-hit != 'true'
        run: |
          RELEASE=v$SHFMT_VERSION
          FILENAME=shfmt_v${SHFMT_VERSION}_linux_amd64

          mkdir -p ~/.local/bin

          curl -fLsS \
            -o ~/.local/bin/shfmt \
            https://github.com/mvdan/sh/releases/download/$RELEASE/$FILENAME

      - name: Add shfmt to PATH
        run: |
          chmod +x ~/.local/bin/shfmt
          printf '%s\n' "$HOME/.local/bin" >>"$GITHUB_PATH"

      - name: Run shfmt
        run: shfmt -d .

      - name: Run ShellCheck
        run: find . -type f -name "*.sh" -exec shellcheck {} +
